name: Build and Push Student Service

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: studentmanagement881.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t studentmanagement881.azurecr.io/student-service:1.0 .

      - name: Push Docker image
        run: |
          docker push studentmanagement881.azurecr.io/student-service:1.0
